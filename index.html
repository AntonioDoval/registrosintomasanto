<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d4a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Registro">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Registro</title>
<style>
  :root{
    --bg:#f4f6f7; --card:#ffffff; --fg:#14211f; --muted:#69787c;
    --line:#dfe5e7; --accent:#1d6f8b; --accent-fg:#ffffff;
    --warn:#9a5b12; --warn-bg:#fdf3e3; --ok:#2c7a4b; --danger:#a3352b;
    --radius:14px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#11171a; --card:#1a2226; --fg:#e8eef0; --muted:#94a5aa;
      --line:#2b363b; --accent:#57b6d6; --accent-fg:#0b1114;
      --warn:#e5b76a; --warn-bg:#2e2617; --ok:#6cc48d; --danger:#e68a80;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    overscroll-behavior-y:contain;
  }
  button,input,textarea,select{font:inherit;color:inherit}
  button{border:0;background:none;cursor:pointer}

  header{
    position:sticky;top:0;z-index:20;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 12px) 16px 10px;
    display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);
  }
  header h1{font-size:19px;margin:0;flex:1;font-weight:650;letter-spacing:-.01em}
  .badge{
    font-size:12px;padding:4px 9px;border-radius:999px;
    background:var(--warn-bg);color:var(--warn);font-weight:600;
  }
  .badge[hidden]{display:none}
  .iconbtn{
    width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
    font-size:20px;background:var(--card);border:1px solid var(--line)
  }
  main{padding:16px 16px 40px;max-width:560px;margin:0 auto}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
     margin:22px 0 8px;font-weight:650}
  h2:first-child{margin-top:4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 12px;display:flex;flex-direction:column;align-items:center;gap:7px;
    font-weight:600;font-size:15px;min-height:86px;justify-content:center;
    transition:transform .08s
  }
  .tile:active{transform:scale(.97)}
  .tile .em{font-size:25px;line-height:1}
  .tile.wide{grid-column:1/-1;flex-direction:row;justify-content:flex-start;
             gap:12px;min-height:0;padding:14px 16px}

  .activo{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--warn);
    border-radius:var(--radius);padding:11px 12px;display:flex;align-items:center;
    gap:10px;margin-bottom:8px
  }
  .activo .n{flex:1;min-width:0}
  .activo .n b{display:block;font-size:15px}
  .activo .n span{font-size:13px;color:var(--muted)}
  .activo button{
    background:var(--accent);color:var(--accent-fg);padding:9px 13px;
    border-radius:10px;font-size:14px;font-weight:600;white-space:nowrap
  }

  .rec{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);align-items:flex-start}
  .rec:last-child{border-bottom:0}
  .rec .t{font-size:12px;color:var(--muted);width:60px;flex:none;padding-top:2px;font-variant-numeric:tabular-nums}
  .rec .t .f{display:block;font-weight:650;opacity:.8}
  .rec .b{flex:1;min-width:0;text-align:left;padding:0;background:none;border:0;font:inherit;color:inherit}
  .rec .b:active{opacity:.55}
  .rec .b b{font-size:15px;font-weight:600}
  .rec .b .val{color:var(--accent);font-weight:700}
  .rec .b p{margin:2px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  .rec .s{font-size:13px;flex:none;padding-top:3px}
  .rec .x{font-size:15px;color:var(--muted);padding:2px 4px;flex:none}
  .empty{color:var(--muted);font-size:14px;padding:6px 2px}

  /* ---- hoja modal ---- */
  #sheet{
    position:fixed;inset:0;z-index:40;background:var(--bg);
    display:flex;flex-direction:column;
    transform:translateY(100%);transition:transform .22s ease;visibility:hidden
  }
  #sheet.open{transform:none;visibility:visible}
  #sheet header{border-bottom:1px solid var(--line)}
  #sheetBody{flex:1;overflow-y:auto;padding:14px 16px 20px;max-width:560px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
  #sheetFoot{
    padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);
    border-top:1px solid var(--line);background:var(--card);
  }
  .save{
    width:100%;background:var(--accent);color:var(--accent-fg);
    padding:15px;border-radius:12px;font-weight:700;font-size:16px;
    max-width:560px;margin:0 auto;display:block
  }
  .save:disabled{opacity:.45}

  label{display:block;font-size:13px;font-weight:650;color:var(--muted);margin:16px 0 7px}
  label:first-child{margin-top:2px}
  input[type=text],input[type=datetime-local],textarea{
    width:100%;max-width:100%;min-width:0;display:block;
    background:var(--card);border:1px solid var(--line);
    border-radius:11px;padding:13px 12px;outline:none
  }
  /* iOS le da a datetime-local un ancho intrínseco que ignora al contenedor */
  input[type=datetime-local]{
    -webkit-appearance:none;appearance:none;
    text-align:left;height:50px;line-height:22px
  }
  input[type=datetime-local]::-webkit-date-and-time-value{
    text-align:left;margin:0;min-width:0
  }
  input[type=datetime-local]::-webkit-calendar-picker-indicator{margin-left:auto}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{resize:vertical;min-height:84px}

  .scale{display:flex;gap:5px;margin-bottom:4px}
  .scale button{
    flex:1;min-width:0;min-height:68px;border-radius:10px;background:var(--card);
    border:1px solid var(--line);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;padding:7px 3px
  }
  .scale .n{font-weight:700;font-size:17px;line-height:1}
  .scale .t{font-size:10.5px;line-height:1.15;color:var(--muted);text-align:center;hyphens:auto}
  .scale button[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
  .scale button[aria-pressed=true] .n{color:var(--accent-fg)}
  .scale button[aria-pressed=true] .t{color:var(--accent-fg);opacity:.85}

  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{
    background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:13px 14px;text-align:left;display:flex;gap:11px;align-items:center;font-size:15px
  }
  .opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
  .opt .num{font-weight:700;width:18px;flex:none}
  .opt .d{font-size:13px;opacity:.72}

  .linkbtn{color:var(--accent);font-weight:650;font-size:14px;padding:10px 0;display:block}
  .row2{display:flex;gap:9px}
  .row2 > div{flex:1;min-width:0}
  .note{font-size:13px;color:var(--muted);margin:10px 0 6px;line-height:1.5}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);
    background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;
    font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>Registro</h1>
  <span class="badge" id="badge" hidden></span>
  <button class="iconbtn" id="btnCfg" aria-label="Ajustes">⚙</button>
</header>

<main>
  <div id="activosWrap" hidden>
    <h2>En curso</h2>
    <div id="activos"></div>
  </div>

  <h2>Registrar</h2>
  <div class="grid" id="tiles"></div>

  <h2 id="tituloLista">Hoy</h2>
  <div id="recientes"></div>
  <button class="linkbtn" id="verMas" hidden></button>
  <p class="note" id="pista">Tocá cualquier registro para corregirlo.</p>
</main>

<div id="sheet" role="dialog" aria-modal="true">
  <header>
    <button class="iconbtn" id="btnBack" aria-label="Volver">←</button>
    <h1 id="sheetTitle">—</h1>
  </header>
  <div id="sheetBody"></div>
  <div id="sheetFoot"><button class="save" id="btnSave">Guardar</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ===================== configuración ===================== */

const SYMPTOMS = ["Gases","Hinchazón","Cefalea","Acidez","Otro"];

const BRISTOL = [
  ["1","Bolitas duras separadas"],
  ["2","Con forma de salchicha, grumosa"],
  ["3","Salchicha con grietas en la superficie"],
  ["4","Salchicha lisa y blanda"],
  ["5","Trozos blandos con bordes definidos"],
  ["6","Trozos blandos irregulares, pastosa"],
  ["7","Líquida, sin trozos sólidos"]
];

const CATS = {
  comida:    {label:"Comida",     em:"🍴", cat:"Comida",     form:"rango",  txt:"Qué comiste", req:true},
  ejercicio: {label:"Ejercicio",  em:"🏃", cat:"Ejercicio",  form:"rango",  txt:"Qué hiciste", req:true},
  medicacion:{label:"Medicación", em:"💊", cat:"Medicación", form:"punto",  txt:"Qué tomaste y dosis", req:true},
  animo:     {label:"Ánimo",      em:"🙂", cat:"Ánimo",      form:"escala", txt:"Observaciones",
              esc:"Ánimo", labs:["muy mal","mal","normal","bien","muy bien"]},
  sueno:     {label:"Sueño",      em:"😴", cat:"Sueño",      form:"sueno",  txt:"Observaciones",
              esc:"Calidad del sueño", labs:["pésimo","malo","regular","bueno","muy bueno"]},
  deposicion:{label:"Deposición", em:"🚽", cat:"Deposición", form:"bristol",txt:"Observaciones"},
  sintoma:   {label:"Síntoma",    em:"⚡", cat:null,         form:"sintoma",txt:"Observaciones",
              esc:"Gravedad", labs:["leve","molesto","afecta el día","fuerte","incapacita"]}
};

/* ===================== almacenamiento ===================== */

const LS = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

let verTodo  = false;
let cfg      = LS.get("cfg",{url:"",token:""});
let queue    = LS.get("queue",[]);      // operaciones pendientes de enviar
let entries  = LS.get("entries",[]);    // copia local de lo registrado
let activos  = LS.get("activos",[]);    // síntomas sin hora de fin

const saveAll = () => { LS.set("queue",queue); LS.set("entries",entries); LS.set("activos",activos); };

/* ===================== utilidades ===================== */

const $ = id => document.getElementById(id);

function uid(){
  return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
}
function nowLocal(){
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0,16);
}
function hhmm(s){ return s ? s.slice(11,16) : ""; }
function esHoy(s){ return s && s.slice(0,10) === nowLocal().slice(0,10); }

function transcurrido(desde){
  const min = Math.max(0, Math.round((Date.now() - new Date(desde).getTime())/60000));
  if (min < 60) return "hace " + min + " min";
  const h = Math.floor(min/60), m = min%60;
  return "hace " + h + " h" + (m ? " " + m + " min" : "");
}

let toastT;
function toast(msg){
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ===================== sincronización ===================== */

let syncing = false;

async function sync(silencioso){
  if (syncing || !queue.length) return;
  if (!cfg.url){ if(!silencioso) toast("Falta configurar el destino (⚙)"); return; }
  if (!navigator.onLine) return;

  syncing = true;
  const lote = queue.slice(0, 50);
  try{
    // text/plain evita el preflight CORS, que Apps Script no responde.
    const res = await fetch(cfg.url, {
      method:"POST",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({token:cfg.token, ops:lote}),
      redirect:"follow"
    });
    const data = await res.json();
    if (data.ok){
      const ids = new Set(lote.map(o=>o.k));
      queue = queue.filter(o=>!ids.has(o.k));
      lote.forEach(o=>{
        const e = entries.find(x=>x.id===o.id);
        if (e && !queue.some(q=>q.id===o.id)) e.sync = true;
      });
      saveAll(); render();
      if (queue.length) sync(true);
    } else if (data.error === "token"){
      if (!silencioso) toast("Token incorrecto");
    } else if (!silencioso){
      toast("Error del servidor");
    }
  }catch(err){
    if (!silencioso) toast("Sin conexión — queda pendiente");
  }finally{
    syncing = false;
  }
}

function encolar(op){
  op.k = uid();
  queue.push(op);
  saveAll();
  sync(true);
}

/* ===================== registro ===================== */

function guardar(row){
  row.id = uid();
  row.registrado = nowLocal();
  entries.unshift(Object.assign({sync:false}, row));
  entries = entries.slice(0,120);
  encolar({op:"add", id:row.id, row:row});

  if (row.abierto){
    activos.push({id:row.id, categoria:row.categoria, inicio:row.inicio});
  }
  saveAll(); render();
  toast(queue.length ? "Guardado — se envía al reconectar" : "Guardado");
}

// Si el alta todavía no salió, se corrige ahí mismo en vez de encolar otra operación.
function pendienteDe(id){
  return queue.find(o=>o.op==="add" && o.id===id);
}

function cerrarActivo(id){
  const fin = nowLocal();
  const a = activos.find(x=>x.id===id);
  activos = activos.filter(x=>x.id!==id);
  const e = entries.find(x=>x.id===id);
  if (e){ e.fin = fin; e.sync = false; }

  const p = pendienteDe(id);
  if (p){ p.row.fin = fin; saveAll(); sync(true); }
  else encolar({op:"update", id:id, fin:fin});

  saveAll(); render();
  toast((a?a.categoria:"Síntoma") + " cerrado");
}

function editarGuardar(id, row){
  const e = entries.find(x=>x.id===id);
  if (e){
    e.categoria = row.categoria; e.inicio = row.inicio; e.fin = row.fin;
    e.valor = row.valor; e.comentarios = row.comentarios; e.sync = false;
  }
  activos = activos.filter(x=>x.id!==id);
  if (row.abierto) activos.push({id:id, categoria:row.categoria, inicio:row.inicio});

  const p = pendienteDe(id);
  if (p){ Object.assign(p.row, row); saveAll(); sync(true); }
  else encolar({op:"edit", id:id, row:row});

  saveAll(); render();
  toast("Cambios guardados");
}

function borrar(id){
  if (!confirm("¿Borrar este registro?")) return;
  entries = entries.filter(x=>x.id!==id);
  activos = activos.filter(x=>x.id!==id);
  queue = queue.filter(o=>!(o.op==="add" && o.id===id));
  encolar({op:"delete", id:id});
  saveAll(); render();
}

/* ===================== pantalla principal ===================== */

function render(){
  // pendientes
  const b = $("badge");
  b.hidden = !queue.length;
  b.textContent = queue.length + " sin enviar";

  // en curso
  $("activosWrap").hidden = !activos.length;
  const ac = $("activos");
  ac.textContent = "";
  activos.forEach(a=>{
    const d = document.createElement("div");
    d.className = "activo";
    const n = document.createElement("div");
    n.className = "n";
    const bb = document.createElement("b"); bb.textContent = a.categoria;
    const sp = document.createElement("span"); sp.textContent = "desde " + hhmm(a.inicio) + " · " + transcurrido(a.inicio);
    n.append(bb,sp);
    const btn = document.createElement("button");
    btn.textContent = "Terminó";
    btn.onclick = ()=>cerrarActivo(a.id);
    d.append(n,btn);
    ac.append(d);
  });

  // lista: hoy por defecto (por momento de registro, así el sueño de anoche cae hoy)
  const r = $("recientes");
  r.textContent = "";
  const esDeHoy = e => esHoy(e.registrado || e.reg || e.inicio);
  const lista = verTodo ? entries : entries.filter(esDeHoy);
  const anteriores = entries.length - entries.filter(esDeHoy).length;

  $("tituloLista").textContent = verTodo ? "Todos los registros" : "Hoy";

  if (!lista.length){
    const p = document.createElement("div");
    p.className = "empty";
    p.textContent = "Todavía no registraste nada hoy.";
    r.append(p);
  }

  lista.forEach(e=>{
    const d = document.createElement("div"); d.className = "rec";

    const t = document.createElement("div"); t.className = "t";
    if (!esDeHoy(e)){
      const f = document.createElement("span"); f.className="f";
      f.textContent = e.inicio.slice(8,10) + "/" + e.inicio.slice(5,7);
      t.append(f);
    }
    t.append(document.createTextNode(hhmm(e.inicio) + (e.fin ? "–" + hhmm(e.fin) : "")));

    const bd = document.createElement("button"); bd.className = "b";
    bd.setAttribute("aria-label", "Editar " + e.categoria);
    const bb = document.createElement("b"); bb.textContent = e.categoria;
    bd.append(bb);
    if (e.valor !== "" && e.valor != null){
      const v = document.createElement("span"); v.className = "val";
      v.textContent = e.categoria === "Deposición"
        ? "  Bristol " + e.valor
        : "  " + e.valor + "/5";
      bd.append(v);
    }
    if (e.comentarios){
      const p = document.createElement("p"); p.textContent = e.comentarios; bd.append(p);
    }
    bd.onclick = ()=>editar(e);

    const s = document.createElement("div"); s.className = "s";
    s.textContent = e.sync ? "✓" : "⏳";
    s.title = e.sync ? "Enviado" : "Pendiente";
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×";
    x.setAttribute("aria-label","Borrar");
    x.onclick = ()=>borrar(e.id);

    d.append(t,bd,s,x);
    r.append(d);
  });

  const link = $("verMas");
  if (verTodo){
    link.hidden = false; link.textContent = "Ver sólo hoy";
  } else if (anteriores){
    link.hidden = false;
    link.textContent = "Ver registros anteriores (" + anteriores + ")";
  } else {
    link.hidden = true;
  }
}

function tiles(){
  const g = $("tiles");
  g.textContent = "";
  Object.keys(CATS).forEach(k=>{
    const c = CATS[k];
    const b = document.createElement("button");
    b.className = "tile" + (k==="sintoma" ? " wide" : "");
    const em = document.createElement("span"); em.className = "em"; em.textContent = c.em;
    const tx = document.createElement("span"); tx.textContent = c.label;
    b.append(em,tx);
    b.onclick = ()=>abrir(k);
    g.append(b);
  });
}

/* ===================== formularios ===================== */

let form = null;

function abrirHoja(titulo){
  $("sheetTitle").textContent = titulo;
  $("sheet").classList.add("open");
  $("sheetBody").scrollTop = 0;
}
function cerrarHoja(){
  $("sheet").classList.remove("open");
  form = null;
}

// bloques reutilizables -------------------------------------------------

function bloqueEscala(state, cfgc){
  const wrap = document.createElement("div");
  const l = document.createElement("label"); l.textContent = cfgc.esc;
  const sc = document.createElement("div"); sc.className = "scale";
  cfgc.labs.forEach((txt,idx)=>{
    const i = idx + 1;
    const b = document.createElement("button");
    b.type = "button";
    b.setAttribute("aria-pressed","false");
    b.setAttribute("aria-label", i + " · " + txt);
    const n = document.createElement("span"); n.className = "n"; n.textContent = i;
    const t = document.createElement("span"); t.className = "t"; t.textContent = txt;
    b.append(n,t);
    if (Number(state.valor) === i) b.setAttribute("aria-pressed","true");
    b.onclick = ()=>{
      state.valor = i;
      sc.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true");
      validar();
    };
    sc.append(b);
  });
  wrap.append(l,sc);
  return wrap;
}

function bloqueFecha(labelTxt, key, state){
  const wrap = document.createElement("div");
  const l = document.createElement("label"); l.textContent = labelTxt;
  const i = document.createElement("input");
  i.type = "datetime-local";
  i.value = state[key] || nowLocal();
  state[key] = i.value;
  i.oninput = ()=>{ state[key] = i.value; validar(); };
  wrap.append(l,i);
  return wrap;
}

function bloqueFinOpcional(state){
  const wrap = document.createElement("div");
  const link = document.createElement("button");
  link.type = "button"; link.className = "linkbtn";
  link.textContent = "+ agregar hora de fin";
  const box = document.createElement("div"); box.hidden = true;
  const l = document.createElement("label"); l.textContent = "Fin";
  const i = document.createElement("input"); i.type = "datetime-local";
  i.oninput = ()=>{ state.fin = i.value; };
  const quitar = document.createElement("button");
  quitar.type="button"; quitar.className="linkbtn"; quitar.textContent = "− quitar hora de fin";
  quitar.onclick = ()=>{ state.fin=""; i.value=""; box.hidden=true; link.hidden=false; };
  box.append(l,i,quitar);
  link.onclick = ()=>{
    box.hidden = false; link.hidden = true;
    i.value = nowLocal(); state.fin = i.value;
  };
  if (state.fin){ i.value = state.fin; box.hidden = false; link.hidden = true; }
  wrap.append(link,box);
  return wrap;
}

function bloqueTexto(labelTxt, state, req){
  const wrap = document.createElement("div");
  const l = document.createElement("label"); l.textContent = labelTxt + (req ? "" : " (opcional)");
  const t = document.createElement("textarea");
  t.value = state.comentarios || "";
  t.oninput = ()=>{ state.comentarios = t.value; validar(); };
  wrap.append(l,t);
  return wrap;
}

function validar(){
  if (!form) return;
  $("btnSave").disabled = !form.valido();
}

// armado por categoría --------------------------------------------------

function abrir(key){
  const c = CATS[key];
  if (key === "sintoma") return elegirSintoma();
  construir(c, c.cat);
}

// de la categoría guardada al formulario que la creó
function catDe(categoria){
  for (const k in CATS){ if (CATS[k].cat === categoria) return CATS[k]; }
  return CATS.sintoma;   // cualquier otro nombre es un síntoma
}

function editar(e){
  construir(catDe(e.categoria), e.categoria, e);
}

function elegirSintoma(){
  abrirHoja("Síntoma");
  const body = $("sheetBody");
  body.textContent = "";
  $("sheetFoot").hidden = true;

  const l = document.createElement("label"); l.textContent = "¿Cuál?";
  const opts = document.createElement("div"); opts.className = "opts";
  SYMPTOMS.forEach(s=>{
    const b = document.createElement("button");
    b.className = "opt"; b.type = "button"; b.textContent = s;
    b.onclick = ()=>{
      if (s === "Otro"){
        const nombre = (prompt("¿Qué síntoma?") || "").trim();
        if (!nombre) return;
        construir(CATS.sintoma, nombre.charAt(0).toUpperCase() + nombre.slice(1));
      } else {
        construir(CATS.sintoma, s);
      }
    };
    opts.append(b);
  });
  body.append(l,opts);
}

function construir(c, categoria, ex){
  abrirHoja((ex ? "Editar · " : "") + (categoria || c.label));
  $("sheetFoot").hidden = false;
  $("btnSave").textContent = ex ? "Guardar cambios" : "Guardar";
  const body = $("sheetBody");
  body.textContent = "";

  const st = ex
    ? { categoria: ex.categoria, valor: ex.valor === "" || ex.valor == null ? "" : Number(ex.valor),
        inicio: ex.inicio, fin: ex.fin || "", comentarios: ex.comentarios || "",
        abierto: false, editId: ex.id }   // sólo el form de síntoma lo pone en true
    : { categoria: categoria, valor:"", inicio:nowLocal(), fin:"", comentarios:"", abierto:false, editId:null };

  if (c.form === "rango"){
    body.append(bloqueTexto(c.txt, st, true));
    body.append(bloqueFecha("Inicio","inicio",st));
    body.append(bloqueFinOpcional(st));
    form = { st, valido:()=> !!st.comentarios.trim() && !!st.inicio };
  }

  else if (c.form === "punto"){
    body.append(bloqueTexto(c.txt, st, true));
    body.append(bloqueFecha("Hora","inicio",st));
    form = { st, valido:()=> !!st.comentarios.trim() && !!st.inicio };
  }

  else if (c.form === "escala"){
    body.append(bloqueEscala(st, c));
    body.append(bloqueFecha("Hora","inicio",st));
    body.append(bloqueTexto(c.txt, st, false));
    form = { st, valido:()=> st.valor !== "" && !!st.inicio };
  }

  else if (c.form === "sueno"){
    body.append(bloqueEscala(st, c));

    const st2 = { ac: ex ? st.inicio : "", le: ex ? st.fin : "" };
    const l1 = document.createElement("label"); l1.textContent = "Me acosté";
    const i1 = document.createElement("input"); i1.type = "datetime-local";
    i1.value = st2.ac;
    i1.oninput = ()=>{ st2.ac = i1.value; validar(); };
    const l2 = document.createElement("label"); l2.textContent = "Me levanté";
    const i2 = document.createElement("input"); i2.type = "datetime-local";
    i2.value = st2.le;
    i2.oninput = ()=>{ st2.le = i2.value; validar(); };
    body.append(l1,i1,l2,i2);

    const ay = document.createElement("button");
    ay.type="button"; ay.className="linkbtn";
    ay.textContent = "Completar con anoche 23:00 → ahora";
    ay.onclick = ()=>{
      const d = new Date(); d.setDate(d.getDate()-1); d.setHours(23,0,0,0);
      d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
      i1.value = d.toISOString().slice(0,16); st2.ac = i1.value;
      i2.value = nowLocal(); st2.le = i2.value;
      validar();
    };
    body.append(ay);

    const nota = document.createElement("p"); nota.className = "note";
    nota.textContent = "Los horarios son opcionales. Si los dejás vacíos se guarda la hora en que registrás.";
    body.append(nota);

    body.append(bloqueTexto(c.txt, st, false));
    form = {
      st, valido:()=> st.valor !== "",
      pre:()=>{ st.inicio = st2.ac || (ex ? st.inicio : nowLocal()); st.fin = st2.le || ""; }
    };
  }

  else if (c.form === "bristol"){
    const l = document.createElement("label"); l.textContent = "Escala de Bristol";
    const opts = document.createElement("div"); opts.className = "opts";
    BRISTOL.forEach(([n,desc])=>{
      const b = document.createElement("button");
      b.className = "opt"; b.type = "button";
      b.setAttribute("aria-pressed","false");
      const num = document.createElement("span"); num.className="num"; num.textContent = n;
      const d = document.createElement("span"); d.className="d"; d.textContent = desc;
      b.append(num,d);
      if (Number(st.valor) === Number(n)) b.setAttribute("aria-pressed","true");
      b.onclick = ()=>{
        st.valor = Number(n);
        opts.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed","false"));
        b.setAttribute("aria-pressed","true");
        validar();
      };
      opts.append(b);
    });
    body.append(l,opts);
    body.append(bloqueFecha("Hora","inicio",st));
    body.append(bloqueTexto(c.txt, st, false));
    form = { st, valido:()=> st.valor !== "" && !!st.inicio };
  }

  else if (c.form === "sintoma"){
    body.append(bloqueEscala(st, c));
    body.append(bloqueFecha("Empezó","inicio",st));

    const l = document.createElement("label"); l.textContent = "¿Ya terminó?";
    const opts = document.createElement("div"); opts.className = "opts";
    const yaTermino = !!st.fin;
    const bSigue = document.createElement("button");
    bSigue.className="opt"; bSigue.type="button";
    bSigue.textContent = "Sigue — lo cierro después";
    bSigue.setAttribute("aria-pressed", String(!yaTermino));
    const bFin = document.createElement("button");
    bFin.className="opt"; bFin.type="button";
    bFin.textContent = "Ya terminó";
    bFin.setAttribute("aria-pressed", String(yaTermino));

    const finBox = document.createElement("div"); finBox.hidden = !yaTermino;
    const lf = document.createElement("label"); lf.textContent = "Terminó";
    const inf = document.createElement("input"); inf.type = "datetime-local";
    inf.value = st.fin || "";
    inf.oninput = ()=>{ st.fin = inf.value; };
    finBox.append(lf,inf);

    bSigue.onclick = ()=>{
      st.abierto = true; st.fin = ""; inf.value = ""; finBox.hidden = true;
      bSigue.setAttribute("aria-pressed","true"); bFin.setAttribute("aria-pressed","false");
    };
    bFin.onclick = ()=>{
      st.abierto = false;
      if (!inf.value){ inf.value = nowLocal(); }
      st.fin = inf.value;
      finBox.hidden = false;
      bFin.setAttribute("aria-pressed","true"); bSigue.setAttribute("aria-pressed","false");
    };
    st.abierto = !yaTermino;

    opts.append(bSigue,bFin);
    body.append(l,opts,finBox);
    body.append(bloqueTexto(c.txt, st, false));
    form = { st, valido:()=> st.valor !== "" && !!st.inicio };
  }

  validar();
}

/* ===================== ajustes ===================== */

function ajustes(){
  abrirHoja("Ajustes");
  $("sheetFoot").hidden = true;
  const body = $("sheetBody");
  body.textContent = "";

  const l1 = document.createElement("label"); l1.textContent = "URL de la app web (termina en /exec)";
  const i1 = document.createElement("input"); i1.type="text"; i1.value = cfg.url;
  i1.setAttribute("autocapitalize","off"); i1.setAttribute("autocorrect","off");
  const l2 = document.createElement("label"); l2.textContent = "Token";
  const i2 = document.createElement("input"); i2.type="text"; i2.value = cfg.token;
  i2.setAttribute("autocapitalize","off"); i2.setAttribute("autocorrect","off");

  const b = document.createElement("button");
  b.className = "save"; b.style.marginTop = "22px";
  b.textContent = "Guardar y probar";
  b.onclick = async ()=>{
    cfg = { url: i1.value.trim(), token: i2.value.trim() };
    LS.set("cfg", cfg);
    if (!cfg.url) return toast("Falta la URL");
    b.disabled = true; b.textContent = "Probando…";
    try{
      const res = await fetch(cfg.url, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify({token:cfg.token, ops:[]})
      });
      const d = await res.json();
      toast(d.ok ? "Conexión correcta" : (d.error==="token" ? "Token incorrecto" : "Error del servidor"));
      if (d.ok){ sync(true); cerrarHoja(); }
    }catch(e){
      toast("No se pudo conectar");
    }finally{
      b.disabled = false; b.textContent = "Guardar y probar";
    }
  };

  const pend = document.createElement("p"); pend.className="note";
  pend.textContent = queue.length
    ? queue.length + " registro(s) esperando para enviarse."
    : "No hay registros pendientes.";

  const reint = document.createElement("button");
  reint.className = "linkbtn"; reint.textContent = "Reintentar envío ahora";
  reint.onclick = ()=>{ sync(false); };

  body.append(l1,i1,l2,i2,b,pend,reint);
}

/* ===================== arranque ===================== */

$("btnCfg").onclick = ajustes;
$("btnBack").onclick = cerrarHoja;
$("verMas").onclick = ()=>{ verTodo = !verTodo; render(); };
$("btnSave").onclick = ()=>{
  if (!form || !form.valido()) return;
  if (form.pre) form.pre();
  const s = form.st;
  const row = {
    categoria: s.categoria,
    inicio: s.inicio,
    fin: s.fin || "",
    valor: s.valor === "" ? "" : s.valor,
    comentarios: (s.comentarios || "").trim(),
    abierto: !!s.abierto
  };
  if (s.editId) editarGuardar(s.editId, row);
  else guardar(row);
  cerrarHoja();
};

window.addEventListener("online", ()=>sync(true));
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden){ render(); sync(true); } });
setInterval(()=>{ if(!document.hidden){ sync(true); render(); } }, 60000);

tiles();
render();
sync(true);
if (!cfg.url) setTimeout(()=>toast("Configurá el destino en ⚙"), 700);

if ("serviceWorker" in navigator){
  window.addEventListener("load", ()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  // Cuando se publica una versión nueva, se aplica sola (salvo que haya un form abierto).
  let recargando = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{
    if (recargando || $("sheet").classList.contains("open")) return;
    recargando = true;
    location.reload();
  });
}
</script>
